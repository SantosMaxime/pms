name: Release

# Push a tag like v1.1.0 (matching package.json "version") to build the
# Windows installer and publish it as a GitHub Release. The release also gets
# latest.yml, which the in-app updater reads to find new versions.
# Pull requests only build the installer, without publishing.
# A manual run (Actions → Release → Run workflow) can also publish: tick
# "publish" and electron-builder creates the v<version> tag and release.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the version in package.json
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm run build

      - name: Build installer and publish release
        if: env.PUBLISH == 'true'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer only
        if: env.PUBLISH != 'true'
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: pms-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
